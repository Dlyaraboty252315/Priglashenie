<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ответы гостей</title><style>body{font:16px Arial,sans-serif;background:#f8f0e5;color:#594331;margin:0;padding:24px}main{max-width:900px;margin:auto;background:#fffaf2;padding:22px;border:1px solid #c7a66d}h1{font-size:25px}input,button{font:inherit;padding:11px;border:1px solid #c7a66d;background:#fffdf8;color:#594331}button{background:#a77e43;color:white;cursor:pointer;margin:5px 4px 5px 0}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:10px;border-bottom:1px solid #e1d2b7;text-align:left;vertical-align:top}th{background:#f3e5cf}.muted{color:#80664a}.scroll{overflow-x:auto}@media(max-width:600px){body{padding:10px}main{padding:14px}th,td{padding:7px;font-size:14px}}</style></head><body><main><h1>Ответы гостей — үйлену тойы</h1><p class="muted">Введите секретный ключ RSVP_ADMIN_KEY, который настроен в Railway. Этот раздел виден только при правильном ключе.</p><form id="login"><input id="key" type="password" placeholder="Секретный ключ" required autocomplete="current-password"><button>Посмотреть ответы</button></form><div id="result" aria-live="polite"></div></main><script>const form=document.getElementById('login'),result=document.getElementById('result');form.addEventListener('submit',async e=>{e.preventDefault();const key=document.getElementById('key').value;result.textContent='Загрузка…';try{const r=await fetch('/api/admin/rsvps?key='+encodeURIComponent(key));const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));result.innerHTML='<h2>Всего ответов: '+d.count+' · Всего придут: '+d.attending+'</h2><p><a id="csv" href="/api/admin/rsvps.csv?key='+encodeURIComponent(key)+'">Скачать ответы в Excel (CSV)</a></p><div class="scroll"><table><thead><tr><th>Дата ответа</th><th>Ответ</th><th>Кол-во</th><th>Имена</th></tr></thead><tbody>'+d.responses.map(x=>'<tr><td>'+esc(new Date(x.createdAt).toLocaleString('ru-RU'))+'</td><td>'+(x.attendance==='yes'?'Келемін':'Келе алмаймын')+'</td><td>'+x.guestCount+'</td><td>'+esc(x.guests.join(', '))+'</td></tr>').join('')+'</tbody></table></div>'; }catch(err){result.textContent='Не удалось получить ответы. Проверьте ключ и настройки Railway.'}});</script></body></html>
